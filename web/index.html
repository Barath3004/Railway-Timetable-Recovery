<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Railway Recovery Control Room</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">R</span><div><strong>Railway Recovery</strong><small>Operations control room</small></div></div>
      <div class="network-status"><span class="status-dot"></span><span>System nominal</span><small>Baseline timetable protected</small></div>
      <nav class="nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">01</span>Dashboard</button>
        <button class="nav-item" data-page="disruptions"><span class="nav-icon">02</span>Disruptions</button>
        <button class="nav-item" data-page="trains"><span class="nav-icon">03</span>Trains</button>
        <button class="nav-item" data-page="recovery"><span class="nav-icon">04</span>Recovery</button>
        <button class="nav-item" data-page="analytics"><span class="nav-icon">05</span>Analytics</button>
        <button class="nav-item" data-page="history"><span class="nav-icon">06</span>History</button>
      </nav>
      <div class="sidebar-footer"><span class="live-dot"></span>Live data connection</div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div><p class="eyebrow">NETWORK OPERATIONS</p><h1 id="page-title">Dashboard</h1></div>
        <div class="topbar-meta"><span id="clock"></span><span class="header-status"><span class="status-dot"></span>Backend online</span></div>
      </header>
      <div id="toast" class="toast" role="status"></div>
      <section id="page-content" class="page-content"></section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
